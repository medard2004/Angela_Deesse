name: angela_dress
description: Angela Dress - maquette UI/UX de l'application de gestion d'atelier (sans back-end)
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  crypto: ^3.0.3
  drift: 2.34.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.1.2
  intl: any
  path: ^1.9.0
  path_provider: ^2.1.0
  provider: ^6.1.2
  sqlite3_flutter_libs: ^0.5.42
  uuid: ^4.5.0

dev_dependencies:
  build_runner: ^2.4.0
  drift_dev: 2.34.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  sqlite3: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-600.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-700.ttf
          weight: 700
